name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/check-skills.ts
      - run: python3 -m unittest discover -s skills/tools/poports/tests -v
      - run: npx --yes skills@latest add . --list
