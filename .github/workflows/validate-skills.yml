name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/check-skills.ts
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Test Feishu Minutes extractor
        run: node --test skills/tools/feishu-minutes-extract/tests/*.test.ts
      - name: Verify generated browser exporter
        run: |
          node skills/tools/feishu-minutes-extract/scripts/build-browser.ts
          git diff --exit-code -- skills/tools/feishu-minutes-extract/scripts/browser-export.js
      - run: python3 -m unittest discover -s skills/tools/poports/tests -v
      - run: npx --yes skills@latest add . --list
